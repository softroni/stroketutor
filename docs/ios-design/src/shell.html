<meta charset="utf-8">
<title>StrokeTutor iOS Screens</title>
<meta name="description" content="Interactive layouts of every screen of the StrokeTutor iOS learner app, with developer notes">
<style>
/* ---- document chrome (theme-aware; the phones themselves keep the product's fixed look) ---- */
:root { --d-bg: #f4f2ee; --d-panel: #fff; --d-ink: #1f1f1f; --d-muted: #6b6b6b; --d-line: rgba(0,0,0,.1); --d-accent: #1c8f5c; --d-accent-soft: #e1f2e9; --d-side: #faf9f6; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --d-bg: #161616; --d-panel: #1f1f1f; --d-ink: #ececec; --d-muted: #a0a0a0; --d-line: rgba(255,255,255,.12); --d-accent: #3fbf85; --d-accent-soft: #1d3a2c; --d-side: #1a1a1a; color-scheme: dark; } }
:root[data-theme="dark"] { --d-bg: #161616; --d-panel: #1f1f1f; --d-ink: #ececec; --d-muted: #a0a0a0; --d-line: rgba(255,255,255,.12); --d-accent: #3fbf85; --d-accent-soft: #1d3a2c; --d-side: #1a1a1a; color-scheme: dark; }
html, body { margin: 0; background: var(--d-bg); color: var(--d-ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
a { color: var(--d-accent); }
.doc { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
.side { background: var(--d-side); border-right: 1px solid var(--d-line); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 14px 40px; }
.side h1 { font-size: 17px; margin: 0 0 2px; }
.side .sub { color: var(--d-muted); font-size: 12.5px; margin: 0 0 16px; }
.side .group { margin-top: 14px; }
.side .group > b { display: block; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--d-muted); padding: 6px 10px; }
.side a.item { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 8px; color: var(--d-ink); text-decoration: none; font-size: 13.5px; }
.side a.item:hover { background: var(--d-line); }
.side a.item.is-active { background: var(--d-accent-soft); color: var(--d-accent); font-weight: 600; }
.side a.item .n { color: var(--d-muted); font-size: 11px; width: 28px; flex: none; font-variant-numeric: tabular-nums; }
.side .modes { display: flex; gap: 6px; margin: 12px 0 4px; }
.side .modes button, .topbar button { font: 600 12.5px/1 inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--d-line); background: var(--d-panel); color: var(--d-ink); cursor: pointer; }
.side .modes button.is-active { background: var(--d-accent); color: #fff; border-color: var(--d-accent); }
main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--d-line); background: var(--d-panel); position: sticky; top: 0; z-index: 50; }
.topbar .crumb { color: var(--d-muted); font-size: 13px; }
.topbar .crumb b { color: var(--d-ink); font-size: 15px; }
.topbar .grow { flex: 1; }
.topbar .kbd { font: 600 11px/1 ui-monospace, Menlo, monospace; padding: 3px 6px; border-radius: 5px; background: var(--d-line); color: var(--d-muted); }

/* ---- one screen at a time ---- */
article.screen { display: none; padding: 28px 24px 60px; }
article.screen.is-active { display: block; }
article.screen > header { margin-bottom: 18px; }
article.screen > header h2 { margin: 0 0 4px; font-size: 22px; }
article.screen > header p.lede { margin: 0; color: var(--d-muted); max-width: 70ch; }
.screen-layout { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: start; }
.device-column { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }
.devices { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.variants button { font: 600 12.5px/1 inherit; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--d-line); background: var(--d-panel); color: var(--d-ink); cursor: pointer; }
.variants button.is-active { background: var(--d-ink); color: var(--d-bg); border-color: var(--d-ink); }
.devices .phone[data-variant] { display: none; }
.devices .phone[data-variant].is-active { display: flex; }
.device-caption { color: var(--d-muted); font-size: 12.5px; max-width: 393px; }
.phone--ipad { transform: scale(.72); transform-origin: top left; margin-bottom: calc(-820px * .28); margin-right: calc(-1180px * .28); }

/* ---- developer notes ---- */
.notes { background: var(--d-panel); border: 1px solid var(--d-line); border-radius: 14px; padding: 6px 22px 18px; min-width: 0; max-width: 760px; }
.notes h3 { font-size: 13px; letter-spacing: .8px; text-transform: uppercase; color: var(--d-muted); margin: 18px 0 6px; }
.notes h4 { font-size: 15px; margin: 16px 0 4px; }
.notes p, .notes li { font-size: 14.5px; line-height: 1.55; }
.notes ul, .notes ol { padding-left: 20px; margin: 4px 0 8px; }
.notes code { font: 500 12.5px/1.4 ui-monospace, Menlo, monospace; background: var(--d-line); padding: 1px 5px; border-radius: 5px; }
.notes pre { font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: var(--d-bg); border: 1px solid var(--d-line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.notes table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 6px 0 10px; }
.notes th, .notes td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--d-line); vertical-align: top; }
.notes th { color: var(--d-muted); font-weight: 600; font-size: 12px; }
.notes .tag { display: inline-block; font: 600 11px/1 inherit; padding: 4px 7px; border-radius: 6px; background: var(--d-accent-soft); color: var(--d-accent); margin-right: 6px; }
.notes .tag--plan { background: #eee5ff; color: #5b3fb8; }
.notes .tag--warn { background: #fdecd9; color: #a35a12; }
.notes .tag--mobbin { background: #e5eefb; color: #2b5fb5; }
.notes blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--d-accent); background: var(--d-bg); border-radius: 0 8px 8px 0; color: var(--d-muted); font-size: 13.5px; }

/* ---- gallery mode: every phone at once ---- */
body.gallery article.screen { display: block; padding: 18px 24px; border-bottom: 1px solid var(--d-line); }
body.gallery .notes { display: none; }
body.gallery .screen-layout { display: block; }
body.gallery .device-column { position: static; }
body.gallery .devices .phone[data-variant] { display: flex; }
body.gallery .variants { display: none; }
body.gallery .devices { transform: scale(.5); transform-origin: top left; margin-bottom: -426px; }
body.gallery .devices .phone { margin-bottom: 40px; }
body.gallery article.screen > header p.lede { display: none; }

/* ---- handbook ---- */
article.handbook { display: none; padding: 28px 24px 80px; max-width: 900px; }
article.handbook.is-active { display: block; }
article.handbook h2 { font-size: 26px; margin: 0 0 6px; }
article.handbook h3 { font-size: 18px; margin: 28px 0 8px; padding-top: 18px; border-top: 1px solid var(--d-line); }
article.handbook h4 { font-size: 15px; margin: 16px 0 4px; }
article.handbook p, article.handbook li { font-size: 15px; line-height: 1.6; }
article.handbook code { font: 500 13px/1.4 ui-monospace, Menlo, monospace; background: var(--d-line); padding: 1px 5px; border-radius: 5px; }
article.handbook pre { font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: var(--d-panel); border: 1px solid var(--d-line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
article.handbook table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0 12px; }
article.handbook th, article.handbook td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--d-line); vertical-align: top; }
article.handbook th { color: var(--d-muted); font-weight: 600; font-size: 12.5px; }
article.handbook .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
article.handbook .swatch { width: 132px; border: 1px solid var(--d-line); border-radius: 10px; overflow: hidden; font-size: 12px; }
article.handbook .swatch i { display: block; height: 44px; }
article.handbook .swatch span { display: block; padding: 6px 8px; }
article.handbook .map { background: var(--d-panel); border: 1px solid var(--d-line); border-radius: 12px; padding: 14px; overflow-x: auto; }
.wide-scroll { overflow-x: auto; }

@media (max-width: 1100px) { .screen-layout { grid-template-columns: 1fr; } .device-column { position: static; } }
@media (max-width: 800px) { .doc { grid-template-columns: 1fr; } .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--d-line); } }

/* ---- product design system (the phones) ---- */
{{DESIGN_SYSTEM_CSS}}
</style>

{{SYMBOLS}}

<div class="doc">
  <nav class="side" id="side">
    <h1>StrokeTutor · iOS screens</h1>
    <p class="sub">Interactive layouts + developer notes · {{DATE}}</p>
    <div class="modes">
      <button type="button" data-mode="single" class="is-active">One screen</button>
      <button type="button" data-mode="gallery">Gallery</button>
    </div>
    <div class="group"><b>Start here</b>
      <a class="item" href="#handbook" data-target="handbook"><span class="n">§</span><span>Developer handbook</span></a>
    </div>
    {{NAV}}
  </nav>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"><b>Developer handbook</b></div>
      <div class="grow"></div>
      <span class="kbd">←</span><span class="kbd">→</span><span class="crumb">&nbsp;previous / next screen</span>
      <button type="button" id="prev">‹ Prev</button><button type="button" id="next">Next ›</button>
    </div>
    <article class="handbook is-active" id="handbook">
      {{HANDBOOK}}
    </article>
    {{SCREENS}}
  </main>
</div>

<script>
(function () {
  const articles = Array.from(document.querySelectorAll('main > article'));
  const ids = articles.map(a => a.id);
  const navItems = Array.from(document.querySelectorAll('.side a.item'));
  const crumb = document.getElementById('crumb');
  let current = null;

  function show(id, opts) {
    if (!ids.includes(id)) id = ids[0];
    current = id;
    articles.forEach(a => a.classList.toggle('is-active', a.id === id));
    navItems.forEach(n => n.classList.toggle('is-active', n.dataset.target === id));
    const art = document.getElementById(id);
    const group = art.dataset.group ? art.dataset.group + ' · ' : '';
    crumb.innerHTML = group + '<b>' + (art.dataset.title || art.querySelector('h2')?.textContent || id) + '</b>';
    try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (_) { /* static snapshot hosting */ }
    const active = navItems.find(n => n.dataset.target === id);
    if (active && !(opts && opts.noScrollNav)) active.scrollIntoView({ block: 'nearest' });
    if (!document.body.classList.contains('gallery')) window.scrollTo({ top: 0 });
  }
  function setVariant(art, name) {
    const phones = art.querySelectorAll('.devices .phone[data-variant]');
    if (!phones.length) return;
    phones.forEach(p => p.classList.toggle('is-active', p.dataset.variant === name));
    art.querySelectorAll('.variants button').forEach(b => b.classList.toggle('is-active', b.dataset.variant === name));
  }
  // initial variant = first button
  articles.forEach(art => {
    const first = art.querySelector('.variants button');
    if (first) setVariant(art, first.dataset.variant);
  });
  document.addEventListener('click', e => {
    const goto = e.target.closest('[data-goto]');
    if (goto) {
      e.preventDefault();
      show(goto.dataset.goto);
      if (goto.dataset.variant) setVariant(document.getElementById(goto.dataset.goto), goto.dataset.variant);
      return;
    }
    const vb = e.target.closest('.variants button');
    if (vb) { setVariant(vb.closest('article'), vb.dataset.variant); return; }
    const sv = e.target.closest('[data-set-variant]');   // a control inside a phone that switches that screen's variant
    if (sv) { e.preventDefault(); setVariant(sv.closest('article'), sv.dataset.setVariant); return; }
    const item = e.target.closest('.side a.item');
    if (item) { e.preventDefault(); show(item.dataset.target, { noScrollNav: true }); return; }
    const mode = e.target.closest('[data-mode]');
    if (mode) {
      document.body.classList.toggle('gallery', mode.dataset.mode === 'gallery');
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('is-active', b === mode));
      if (mode.dataset.mode === 'single') show(current);
    }
  });
  function step(delta) {
    const i = ids.indexOf(current);
    show(ids[Math.min(ids.length - 1, Math.max(0, i + delta))]);
  }
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || ids[0]);
})();
</script>
